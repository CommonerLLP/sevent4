name: Deploy Pages

on:
  # Auto-deploy on push to main is DISABLED (2026-06-17): sevent4 is a PRIVATE
  # repo and the CommonerLLP org is on the Free plan, which does not support
  # GitHub Pages for private repos — so `configure-pages` (enablement: true)
  # fails with "Resource not accessible by integration" on every push.
  # Re-add the push trigger below when the repo goes public again (Pages works
  # on Free for public repos) or the org upgrades to a plan with private Pages.
  #   push:
  #     branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
